[project]
name = "nemora"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.43",
    "psycopg2-binary==2.9.13",
    "asyncpg==0.31.0",
    "geoalchemy2==0.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.11.0",
    "python-jose[cryptography]",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.2",
    "python-multipart==0.0.20",
    "python-dotenv==1.0.1",
    "requests==2.34.2",
]

[tool.fastapi]
entrypoint = "backend.main:app"